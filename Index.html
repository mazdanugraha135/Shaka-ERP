    function loadDatabase() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state.users = parsed.users || JSON.parse(JSON.stringify(DEFAULT_USERS));
          // Pastikan akun Direktur Operasional & IT selalu tersedia
          ['dir_ops', 'it_admin'].forEach(uname => {
            if (!state.users.some(u => u.username === uname)) {
              const def = DEFAULT_USERS.find(u => u.username === uname);
              if (def) state.users.push(JSON.parse(JSON.stringify(def)));
            }
          });
          state.spmList = parsed.spmList || JSON.parse(JSON.stringify(DEFAULT_SPM));
          state.spkList = parsed.spkList || JSON.parse(JSON.stringify(DEFAULT_SPK));
          state.rekananList = parsed.rekananList || JSON.parse(JSON.stringify(DEFAULT_REKANAN));
          state.docs = parsed.docs || JSON.parse(JSON.stringify(DEFAULT_DOCS));
          const loadedInv = parsed.inventory || JSON.parse(JSON.stringify(DEFAULT_INVENTORY));
          state.inventory = (loadedInv.length && loadedInv[0].items) ? loadedInv : JSON.parse(JSON.stringify(DEFAULT_INVENTORY));
          state.stockRequests = parsed.stockRequests || JSON.parse(JSON.stringify(DEFAULT_STOCK_REQ));
          state.progressLogs = parsed.progressLogs || JSON.parse(JSON.stringify(DEFAULT_PROGRESS_LOGS));
          state.spdList = parsed.spdList || JSON.parse(JSON.stringify(DEFAULT_SPD));
          state.kurvaS = parsed.kurvaS || JSON.parse(JSON.stringify(DEFAULT_KURVA_S));
          state.attendanceLogs = parsed.attendanceLogs || [];
          state.masterVehicles = parsed.masterVehicles || state.masterVehicles;
          state.gsheetConfig = parsed.gsheetConfig || state.gsheetConfig;
          state.telegramConfig = parsed.telegramConfig || state.telegramConfig;
        } else {
          resetSeedData(false);
        }
      } catch (e) {
        console.error('Error loading DB:', e);
        resetSeedData(false);
      }
    }

    function syncToGoogleSheet(sheetName, actionLabel, rowObject) {
      const now = new Date().toLocaleString('id-ID', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
      const entry = {
        id: 'gs' + Date.now() + Math.floor(Math.random() * 99),
        timestamp: now,
        sheetName,
        action: actionLabel,
        actor: state.currentUser ? `${state.currentUser.name} (${state.currentUser.role})` : 'System',
        data: rowObject
      };
      if (!state.gsheetConfig.syncQueue) state.gsheetConfig.syncQueue = [];
      state.gsheetConfig.syncQueue.unshift(entry);
      if (state.gsheetConfig.syncQueue.length > 100) state.gsheetConfig.syncQueue.pop();
      saveDatabase();

      // Jika URL Web App Google Apps Script dikonfigurasi, kirim otomatis secara real-time
      if (state.gsheetConfig.webhookUrl && state.gsheetConfig.webhookUrl.startsWith('https://')) {
        fetch(state.gsheetConfig.webhookUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            spreadsheetId: state.gsheetConfig.spreadsheetId,
            sheetName,
            action: actionLabel,
            timestamp: now,
            actor: entry.actor,
            row: rowObject
          })
        }).catch(() => {});
      }
    }

    function formatRupiah(num) {
      return 'Rp ' + Number(num || 0).toLocaleString('id-ID');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const colors = {
        success: 'bg-emerald-600 text-white border-emerald-700',
        error: 'bg-rose-600 text-white border-rose-700',
        warning: 'bg-amber-500 text-slate-950 border-amber-600',
        info: 'shaka-blue text-white border-sky-900'
      };
      const icons = {
        success: 'fa-circle-check',
        error: 'fa-circle-exclamation',
        warning: 'fa-triangle-exclamation',
        info: 'fa-circle-info'
      };
      const el = document.createElement('div');
      el.className = `px-4 py-3 rounded-xl shadow-lg border text-xs font-semibold flex items-center gap-2.5 transition-all ${colors[type] || colors.info}`;
      el.innerHTML = `<i class="fa-solid ${icons[type] || icons.info}"></i><span>${message}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 300);
      }, 3200);
    }

    function openModal(htmlContent) {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      if (!backdrop || !box) return;
      box.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      if (!backdrop) return;
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    function renderAvatar(user, sizeClass = 'w-9 h-9 text-xs') {
      if (user && user.photo) {
        return `<img src="${user.photo}" alt="${user.name}" class="${sizeClass} rounded-full object-cover border border-white/40 shadow-xs flex-shrink-0" />`;
      }
      const initials = ((user && user.name) || 'U')
        .split(' ')
        .map(w => w[0])
        .join('')
        .slice(0, 2)
        .toUpperCase();
      return `<div class="${sizeClass} rounded-full bg-amber-400 text-slate-900 font-extrabold flex items-center justify-center border border-white/40 shadow-xs flex-shrink-0">${initials}</div>`;
    }

    function generateCaptcha() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 5; i++) code += chars[Math.floor(Math.random() * chars.length)];
      state.captchaCode = code;
    }

    function pushTelegramLog(msg) {
      const now = new Date().toTimeString().slice(0, 8);
      state.telegramConfig.logs.unshift({ time: now, msg });
      if (state.telegramConfig.logs.length > 30) state.telegramConfig.logs.pop();
      saveDatabase();
    }

    function handleLogin(e) {
      e.preventDefault();
      const uname = (document.getElementById('login-username')?.value || '').trim().toLowerCase();
      const pass = document.getElementById('login-password')?.value || '';
      const user = state.users.find(u => u.username.toLowerCase() === uname && u.password === pass);
      if (!user) {
        showToast('Username atau Password salah!', 'error');
        return;
      }
      loginSuccess(user);
    }

    function loginSuccess(user) {
      state.currentUser = user;
      state.activePage = 'beranda';
      document.getElementById('login-view').classList.add('hidden');
      const shell = document.getElementById('app-shell');
      shell.classList.remove('hidden');
      shell.classList.add('flex');
      syncUserChrome();
      renderSidebar();
      renderCurrentPage();
      showToast(`Selamat datang, ${user.name} (${user.role})`, 'success');
    }

      closeProfileDropdown();

                        ${r.pmApprovedBy ? `<div class="text-[10px] text-emerald-700"><i class="fa-solid fa-check"></i> 1. PM: ${r.pmApprovedBy} (${r.pmApprovedAt || ''})</div>` : ''}
                        ${r.logisticPreparedBy ? `<div class="text-[10px] text-indigo-700"><i class="fa-solid fa-dolly"></i> 2. Disiapkan Logistik: ${r.logisticPreparedBy} (${r.logisticPreparedAt || ''})</div>` : ''}
                        ${r.logisticIssuedBy ? `<div class="text-[10px] text-sky-700"><i class="fa-solid fa-signature"></i> 3. Dikirim &amp; TTD Digital: ${r.logisticIssuedBy} (${r.logisticIssuedAt || ''})</div>` : ''}
                      </td>
                      <td class="p-3 text-right space-y-1.5 whitespace-nowrap">
                        <div>
                          ${isWaitPm && canApprovePm ? `
                            <button onclick="approveStockByPm('${r.id}', true)" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold">1. Approve PM</button>
                            <button onclick="approveStockByPm('${r.id}', false)" class="px-2.5 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-700 text-white font-bold">Tolak</button>
                          ` : ''}
                          ${isWaitPrep && canIssueLogistik ? `
                            <button onclick="prepareStockByLogistic('${r.id}')" class="px-2.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-bold">
                              <i class="fa-solid fa-dolly mr-1"></i> 2. Approve Persiapan Material
                            </button>
                          ` : ''}
                          ${isPreparing && canIssueLogistik ? `
                            <button onclick="issueStockByLogistic('${r.id}')" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold">
                              <i class="fa-solid fa-signature mr-1"></i> 3. Approve Pengiriman (TTD Digital)
                            </button>
                          ` : ''}
                        </div>
                        ${(isPreparing || isDone) ? `
                          <div>
                            <button onclick="openStockPdfModal('${r.id}')" class="px-2.5 py-1 rounded-lg bg-sky-50 border border-sky-200 hover:bg-sky-100 text-[#0e4f78] font-bold text-[11px]">
                              <i class="fa-solid fa-file-pdf text-rose-600 mr-1"></i> ${isDone ? 'PDF Pengiriman & TTD Digital' : 'PDF Daftar Qty Persiapan'}
                            </button>
                          </div>
                        ` : ''}
                        ${canDeleteModuleData(role) ? `
                          <div>
                            <button onclick="confirmDeleteRecord('Permintaan Material ${r.reqNo} (${r.destinationSite || r.spkRef})', 'executeDeleteStockReq', '${r.id}')" class="px-2.5 py-1 rounded-lg bg-rose-50 border border-rose-200 hover:bg-rose-100 text-rose-700 font-bold text-[11px]">
                              <i class="fa-solid fa-trash mr-1"></i> Hapus Request
                            </button>
                          </div>
                        ` : ''}
                        ${!isWaitPm && !isWaitPrep && !isPreparing && !isDone && !canDeleteModuleData(role) ? '<span class="text-slate-400">-</span>' : ''}
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function executeDeleteStockReq(reqId) {
      if (!canDeleteModuleData(state.currentUser?.role)) return;
      const idx = state.stockRequests.findIndex(r => r.id === reqId);
      if (idx === -1) return;
      const removed = state.stockRequests[idx];
      state.stockRequests.splice(idx, 1);
      saveDatabase();
      syncToGoogleSheet('Permintaan_Material', 'Hapus Request Material', { No_Request: removed.reqNo, Gudang: removed.warehouseName, Tujuan: removed.destinationSite });
      pushTelegramLog(`Hapus Permintaan Material (${removed.reqNo}) oleh ${state.currentUser.name} (${state.currentUser.role})`);
      showToast(`Permintaan material ${removed.reqNo} berhasil dihapus!`, 'warning');
      renderCurrentPage();
    }

    function refreshManageStockItems() {
      const whId = document.getElementById('adj-wh')?.value;
      const wh = state.inventory.find(w => w.id === whId);

      if (!wh || !sel) return;

    }

    function toggleNewMaterialFields() {
      const mode = document.getElementById('adj-mode')?.value;
      const existingBox = document.getElementById('adj-existing-box');
      const newBox = document.getElementById('adj-new-item-box');
      if (mode === 'new_item') {
        existingBox.classList.add('hidden');
        newBox.classList.remove('hidden');
      } else {
        existingBox.classList.remove('hidden');
        newBox.classList.add('hidden');
      }
    }

    function saveStockAdjustment(e) {
      e.preventDefault();
      const whId = document.getElementById('adj-wh')?.value;
      const wh = state.inventory.find(w => w.id === whId);
      const mode = document.getElementById('adj-mode')?.value;
      const qty = Number(document.getElementById('adj-qty')?.value || 0);
      if (!wh || qty <= 0) return;

      if (mode === 'new_item') {
        const code = (document.getElementById('adj-new-code')?.value || '').trim().toUpperCase();
        const name = (document.getElementById('adj-new-name')?.value || '').trim();
        const unit = (document.getElementById('adj-new-unit')?.value || '').trim() || 'Pcs';
        const category = (document.getElementById('adj-new-cat')?.value || '').trim() || 'Aksesoris FO';
        if (!code || !name) {
          showToast('Kode dan Nama Material baru wajib diisi!', 'error');
          return;
        }
        wh.items.push({
          id: 'inv' + Date.now(),
          code,
          name,
          category,
          unit,
          stock: qty,
          minStock: Math.max(1, Math.floor(qty * 0.2))
        });
        syncToGoogleSheet('Stok_Material_Gudang', 'Material Baru', { Gudang: wh.name, Kode: code, Material: name, Stok: qty, Satuan: unit });
        pushTelegramLog(`Stok Baru di ${wh.name}: ${name} (+${qty} ${unit}) oleh ${state.currentUser.name}`);
      } else {
        const itemId = document.getElementById('adj-item')?.value;
        const item = wh.items.find(i => i.id === itemId);
        if (!item) {
          showToast('Pilih material terlebih dahulu atau tambahkan item baru!', 'error');
          return;
        }
        if (mode === 'sub' && item.stock < qty) {
          showToast(`Stok ${item.name} di ${wh.name} hanya ${item.stock} ${item.unit}!`, 'error');
          return;
        }
        item.stock = mode === 'add' ? item.stock + qty : item.stock - qty;
        syncToGoogleSheet('Stok_Material_Gudang', 'Update Stok', { Gudang: wh.name, Kode: item.code, Material: item.name, Perubahan: `${mode === 'add' ? '+' : '-'}${qty}`, Sisa_Stok: item.stock, Satuan: item.unit });
        pushTelegramLog(`Update Stok ${wh.name}: ${item.name} (${mode === 'add' ? '+' : '-'}${qty} ${item.unit}) -> Sisa: ${item.stock} oleh ${state.currentUser.name}`);
      }

      saveDatabase();
      closeModal();
      showToast('Stok gudang berhasil diperbarui!', 'success');
      renderCurrentPage();
    }

    function quickAdjustStock(whId, itemId, delta) {
      const wh = state.inventory.find(w => w.id === whId);
      const item = wh ? wh.items.find(i => i.id === itemId) : null;
      if (!item) return;
      if (item.stock + delta < 0) {
        showToast('Stok tidak bisa kurang dari 0!', 'warning');
        return;
      }
      item.stock += delta;
      saveDatabase();
      renderCurrentPage();
    }

    function addStockReqRow() {
      const whId = document.getElementById('sreq-wh')?.value;
      const wh = state.inventory.find(w => w.id === whId) || state.inventory[0];
      const container = document.getElementById('sreq-items-container');
      if (!wh || !container) return;
      container.insertAdjacentHTML('beforeend', buildStockReqRowHtml(wh));
    }

    function removeStockReqRow(btn) {
      const container = document.getElementById('sreq-items-container');
      if (!container) return;
      if (container.querySelectorAll('.sreq-item-row').length <= 1) {
        showToast('Minimal harus terdapat 1 baris material!', 'warning');
        return;
      }
      btn.closest('.sreq-item-row').remove();
    }

    function refreshRequestWhItems() {
      const whId = document.getElementById('sreq-wh').value;
      const wh = state.inventory.find(w => w.id === whId);
      const container = document.getElementById('sreq-items-container');
      if (!wh || !container) return;
      const defaultItems = wh.items.slice(0, 3);
      container.innerHTML = defaultItems.length
        ? defaultItems.map(it => buildStockReqRowHtml(wh, it.id, '')).join('')
        : buildStockReqRowHtml(wh);
    }

    function saveStockReq(e) {
      e.preventDefault();
      const whId = document.getElementById('sreq-wh').value;
      const wh = state.inventory.find(w => w.id === whId);
      const dest = document.getElementById('sreq-dest').value.trim();
      if (!wh) return;

      const rows = document.querySelectorAll('#sreq-items-container .sreq-item-row');
      const requestedMap = new Map();

      rows.forEach(row => {
        const itemId = row.querySelector('.sreq-row-item')?.value;
        const qty = Number(row.querySelector('.sreq-row-qty')?.value || 0);
        if (itemId && qty > 0) {
          const invItem = wh.items.find(i => i.id === itemId);
          if (invItem) {
            if (requestedMap.has(itemId)) {
              requestedMap.get(itemId).qty += qty;
            } else {
              requestedMap.set(itemId, {
                itemId: invItem.id,
                itemName: invItem.name,
                qty,
                unit: invItem.unit
              });
            }
          }
        }
      });

      const requestedItems = Array.from(requestedMap.values());
      if (requestedItems.length === 0) {
        showToast('Masukkan minimal 1 item material dengan jumlah (Qty) lebih dari 0!', 'error');
        return;
      }

      const reqNo = `REQ-MAT/XI/${String(state.stockRequests.length + 1).padStart(3, '0')}`;
      state.stockRequests.unshift({
        id: 'sreq' + Date.now(),
        reqNo,
        date: new Date().toISOString().slice(0, 10),
        warehouseId: wh.id,
        warehouseName: wh.name,
        spkRef: document.getElementById('sreq-spk').value,
        destinationSite: dest,
        items: requestedItems,
        requester: state.currentUser.name,
        requesterRole: state.currentUser.role,
        notes: document.getElementById('sreq-notes').value.trim(),
        pmApprovedBy: '',
        pmApprovedAt: '',
        logisticPreparedBy: '',
        logisticPreparedAt: '',
        logisticIssuedBy: '',
        logisticIssuedAt: '',
        status: 'Menunggu Approval Project Manager'
      });
      saveDatabase();
      const summaryText = requestedItems.map(i => `${i.itemName} (${i.qty} ${i.unit})`).join(', ');
      syncToGoogleSheet('Permintaan_Material', 'Request Baru', { No_Request: reqNo, Tanggal: new Date().toISOString().slice(0, 10), Gudang_Asal: wh.name, Tujuan_Site: dest, Ref_SPK: document.getElementById('sreq-spk').value, Rincian_Material: summaryText, Pemohon: state.currentUser.name, Status: 'Menunggu Approval Project Manager' });
      pushTelegramLog(`Request Material (${reqNo}) oleh ${state.currentUser.name}: [${summaryText}] dari ${wh.name} kirim ke ${dest} -> Masuk Logistik & Menunggu Approval PM`);
      closeModal();
      showToast(`Permintaan ${requestedItems.length} jenis material berhasil diajukan!`, 'success');
      renderCurrentPage();
    }

    function approveStockByPm(reqId, isApproved) {
      const req = state.stockRequests.find(r => r.id === reqId);
      if (!req) return;
      const now = new Date().toISOString().slice(0, 16).replace('T', ' ');
      const reqItems = req.items || (req.itemName ? [{ itemName: req.itemName, qty: req.qty, unit: req.unit }] : []);
      const summaryText = reqItems.map(i => `${i.itemName} ${i.qty} ${i.unit}`).join(', ');
      if (isApproved) {
        req.status = 'Disetujui PM - Menunggu Persiapan Logistik';
        req.pmApprovedBy = state.currentUser.name;
        req.pmApprovedAt = now;
        pushTelegramLog(`PM (${state.currentUser.name}) menyetujui ${req.reqNo} (${summaryText}) -> Menunggu Approval Persiapan Material oleh Logistik`);
        showToast('Disetujui Project Manager! Diteruskan ke Logistik untuk persiapan material.', 'success');
      } else {
        req.status = 'Ditolak';
        req.pmApprovedBy = state.currentUser.name;
        req.pmApprovedAt = now;
        showToast('Permintaan material ditolak oleh Project Manager.', 'warning');
      }
      saveDatabase();
      renderCurrentPage();
    }

    function prepareStockByLogistic(reqId) {
      const req = state.stockRequests.find(r => r.id === reqId);
      if (!req) return;
      const wh = state.inventory.find(w => w.id === req.warehouseId) || state.inventory[0];
      const reqItems = req.items || (req.itemId ? [{ itemId: req.itemId, itemName: req.itemName, qty: req.qty, unit: req.unit }] : []);

      for (const it of reqItems) {
        const inv = wh ? wh.items.find(i => i.id === it.itemId) : null;
        if (inv && inv.stock < it.qty) {
          showToast(`Stok ${inv.name} di ${wh.name} tidak mencukupi (Tersedia: ${inv.stock} ${inv.unit})!`, 'error');
          return;
        }
      }

      req.status = 'Material Sedang Disiapkan Logistik';
      req.logisticPreparedBy = state.currentUser.name;
      req.logisticPreparedAt = new Date().toISOString().slice(0, 16).replace('T', ' ');
      saveDatabase();

      const summaryText = reqItems.map(i => `${i.itemName} (${i.qty} ${i.unit})`).join(', ');
      pushTelegramLog(`Logistik (${state.currentUser.name}) menyetujui PERSIAPAN MATERIAL ${req.reqNo} [${summaryText}] -> Dokumen PDF Qty Persiapan terbit`);
      showToast('Approval Persiapan Material berhasil! Dokumen PDF Daftar Qty telah diterbitkan.', 'success');
      renderCurrentPage();
      openStockPdfModal(req.id);
    }

    function issueStockByLogistic(reqId) {
      const req = state.stockRequests.find(r => r.id === reqId);
      if (!req) return;
      const wh = state.inventory.find(w => w.id === req.warehouseId) || state.inventory[0];
      const reqItems = req.items || (req.itemId ? [{ itemId: req.itemId, itemName: req.itemName, qty: req.qty, unit: req.unit }] : []);

      // Validasi kecukupan seluruh item terlebih dahulu
      for (const it of reqItems) {
        const inv = wh ? wh.items.find(i => i.id === it.itemId) : null;
        if (inv && inv.stock < it.qty) {
          showToast(`Stok ${inv.name} di ${wh.name} tidak mencukupi (Tersedia: ${inv.stock} ${inv.unit})!`, 'error');
          return;
        }
      }

      // Potong seluruh stok item yang diminta saat pengiriman disetujui
      reqItems.forEach(it => {
        const inv = wh ? wh.items.find(i => i.id === it.itemId) : null;
        if (inv) inv.stock -= it.qty;
      });

      req.status = 'Selesai / Terkirim';
      req.logisticIssuedBy = state.currentUser.name;
      req.logisticIssuedAt = new Date().toISOString().slice(0, 16).replace('T', ' ');
      saveDatabase();
      const summaryText = reqItems.map(i => `${i.itemName} (${i.qty} ${i.unit})`).join(', ');
      syncToGoogleSheet('Permintaan_Material', 'Terkirim & TTD Digital', { No_Request: req.reqNo, Gudang_Asal: req.warehouseName, Tujuan_Site: req.destinationSite, Rincian_Material: summaryText, Logistik_Pengirim: state.currentUser.name, Status: 'Selesai / Terkirim' });
      pushTelegramLog(`Logistik (${state.currentUser.name}) menandatangani PENGIRIMAN MATERIAL ${req.reqNo} [${summaryText}] dari ${req.warehouseName} ke ${req.destinationSite}`);
      showToast('Approval Pengiriman & TTD Digital Logistik terbit! Stok gudang otomatis terpotong.', 'success');
      renderCurrentPage();
      openStockPdfModal(req.id);
    }

      const val = (document.getElementById('captcha-input')?.value || '').trim().toUpperCase();
      if (val !== state.captchaCode) {
        showToast('Kode Capcay tidak sesuai, silakan coba lagi!', 'error');
        generateCaptcha();
        renderCurrentPage();
        return;
      }
      const now = new Date().toTimeString().slice(0, 8);
      const today = new Date().toISOString().slice(0, 10);
      state.attendanceLogs.unshift({
        userId: state.currentUser.id,
        username: state.currentUser.username,
        name: state.currentUser.name,
        role: state.currentUser.role,
        time: now,
        status: 'Hadir (Capcay Valid)'
      });
      saveDatabase();
      syncToGoogleSheet('Presensi_Capcay', 'Check-In Harian', { Tanggal: today, Waktu: now, NIP: state.currentUser.nip, Nama: state.currentUser.name, Role: state.currentUser.role, Status: 'Hadir (Capcay Valid)' });
      pushTelegramLog(`Presensi Capcay: ${state.currentUser.name} (${state.currentUser.role}) Check-In pukul ${now}`);
      showToast('Check-In Capcay berhasil dicatat!', 'success');
      renderCurrentPage();
    }

      pushTelegramLog(`Ping Manual oleh ${state.currentUser.name}: Koneksi Bot Telegram aktif & stabil.`);

      renderCurrentPage();

    function addChildRow() {
      const box = document.getElementById('children-rows');
      const div = document.createElement('div');
      div.className = 'flex gap-2 items-center';
      div.innerHTML = `
        <input type="text" placeholder="Nama Anak" class="child-name flex-1 border border-slate-300 rounded-xl p-2" />
        <input type="date" class="child-dob border border-slate-300 rounded-xl p-2" />
        <button type="button" onclick="this.parentElement.remove()" class="px-2.5 py-2 rounded-xl bg-rose-100 text-rose-700 font-bold"><i class="fa-solid fa-trash"></i></button>
      `;
      box.appendChild(div);
    }

    function handleProfilePhotoUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        const idx = state.users.findIndex(x => x.id === state.currentUser.id);
        if (idx !== -1) {
          state.users[idx].photo = ev.target.result;
          saveDatabase();
          syncUserChrome();
          renderCurrentPage();
          showToast('Foto profil berhasil diperbarui!', 'success');
        }
      };
      reader.readAsDataURL(file);
    }

    function saveUserProfile(e) {
      e.preventDefault();
      const idx = state.users.findIndex(x => x.id === state.currentUser.id);
      if (idx === -1) return;
      const children = [];
      document.querySelectorAll('#children-rows > div').forEach(row => {
        const nm = row.querySelector('.child-name')?.value.trim();
        const db = row.querySelector('.child-dob')?.value || '';
        if (nm) children.push({ name: nm, dob: db });
      });
      state.users[idx] = {
        ...state.users[idx],
        name: document.getElementById('prof-name').value.trim(),
        gender: document.querySelector('input[name="prof-gender"]:checked')?.value || 'Pria',
        religion: document.querySelector('input[name="prof-religion"]:checked')?.value || 'Islam',
        phone: document.getElementById('prof-phone').value.trim(),
        email: document.getElementById('prof-email').value.trim(),
        birthPlace: document.getElementById('prof-birthplace').value.trim(),
        birthDate: document.getElementById('prof-birthdate').value,
        address: document.getElementById('prof-address').value.trim(),
        maritalStatus: document.querySelector('input[name="prof-marital"]:checked')?.value || 'Belum Kawin',
        spouseName: document.getElementById('prof-spouse').value.trim(),
        children
      };
      saveDatabase();
      syncUserChrome();
      syncToGoogleSheet('Data_Karyawan', 'Update Biodata Mandiri', { NIP: state.users[idx].nip, Nama: state.users[idx].name, Role: state.users[idx].role, HP: state.users[idx].phone, Email: state.users[idx].email, Alamat: state.users[idx].address });
      renderCurrentPage();
      showToast('Biodata pribadi tersimpan & tersinkron ke Google Sheet!', 'success');
    }

    function saveUserIdentity(e) {
      e.preventDefault();
      const idx = state.users.findIndex(x => x.id === state.currentUser.id);
      if (idx === -1) return;
      state.users[idx].ktp = document.getElementById('prof-ktp').value.trim();
      state.users[idx].npwp = document.getElementById('prof-npwp').value.trim();
      saveDatabase();
      showToast('Dokumen identitas berhasil disimpan!', 'success');
    }

    function saveUserBank(e) {
      e.preventDefault();
      const idx = state.users.findIndex(x => x.id === state.currentUser.id);
      if (idx === -1) return;
      state.users[idx].bankName = document.getElementById('prof-bank-name').value.trim();
      state.users[idx].bankAcc = document.getElementById('prof-bank-acc').value.trim();
      state.users[idx].bankHolder = document.getElementById('prof-bank-holder').value.trim();
      saveDatabase();
      showToast('Data rekening bank berhasil disimpan!', 'success');
    }

    function advanceDocStatus(docId, nextStatus) {
      const doc = state.docs.find(d => d.id === docId);
      if (!doc) return;

      // Potong saldo SPM/SPK saat di-approve (masuk Menunggu Pembayaran)
      if (nextStatus === 'Menunggu Pembayaran' && doc.status === 'Pending') {
        if (doc.payType.includes('SPM')) {
          const spm = state.spmList.find(s => s.clientDocNo === doc.refNo);
          if (spm) {
            if (spm.remainingValue < doc.amount) {
              showToast(`Sisa saldo SPM ${spm.clientDocNo} tidak mencukupi!`, 'error');
              return;
            }
            spm.remainingValue -= doc.amount;
          }
        } else if (doc.payType.includes('SPK')) {
          const spk = state.spkList.find(s => s.spkNo === doc.refNo);
          if (spk) {
            if (spk.remainingValue < doc.amount) {
              showToast(`Sisa nilai SPK ${spk.spkNo} tidak mencukupi!`, 'error');
              return;
            }
            spk.remainingValue -= doc.amount;
          }
        }
      }

      doc.status = nextStatus;
      saveDatabase();
      syncToGoogleSheet(doc.type === 'Reimburse' ? 'Reimburse' : 'Pengajuan_Dana', `Status: ${nextStatus}`, {
        No_Dokumen: doc.docNo, Perihal: doc.title, Ref_SPM_SPK: doc.refNo, Nominal: doc.amount, Status: nextStatus
      });
      pushTelegramLog(`Update ${doc.type} (${doc.docNo}): Status -> ${nextStatus} oleh ${state.currentUser.name}`);
      showToast(`Status ${doc.docNo} diperbarui menjadi "${nextStatus}"`, 'success');
      renderCurrentPage();
    }

                        ` : ''}

                          <button onclick="confirmDeleteRecord('${d.type} ${d.docNo} — ${d.title.replace(/'/g, '')}', 'executeDeleteDoc', '${d.id}')" class="px-2 py-1 rounded-lg bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold" title="Hapus Data (IT / Dirut)">
                            <i class="fa-solid fa-trash"></i>
                          </button>
                        ` : ''}
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;

    function executeDeleteDoc(docId) {
      if (!canDeleteModuleData(state.currentUser?.role)) return;
      const idx = state.docs.findIndex(d => d.id === docId);
      if (idx === -1) return;
      const removed = state.docs[idx];
      state.docs.splice(idx, 1);
      saveDatabase();
      syncToGoogleSheet(removed.type === 'Reimburse' ? 'Reimburse' : 'Pengajuan_Dana', 'Hapus Dokumen', {
        No_Dokumen: removed.docNo, Perihal: removed.title, Nominal: removed.amount
      });
      pushTelegramLog(`Hapus ${removed.type} (${removed.docNo}) oleh ${state.currentUser.name} (${state.currentUser.role})`);
      showToast(`${removed.type} (${removed.docNo}) berhasil dihapus!`, 'warning');
      renderCurrentPage();
    }

    function updateDocRefOptions() {
      const payType = document.getElementById('doc-pay-type')?.value || '';
      const sel = document.getElementById('doc-ref-no');
      if (!sel) return;
      if (payType.includes('SPK')) {
        sel.innerHTML = state.spkList.map(s => `<option value="${s.spkNo}">${s.spkNo} (${s.siteName} - Sisa ${formatRupiah(s.remainingValue)})</option>`).join('');
      } else {
        sel.innerHTML = state.spmList.map(s => `<option value="${s.clientDocNo}">${s.clientDocNo} (${s.clientName} - Sisa ${formatRupiah(s.remainingValue)})</option>`).join('');
      }
    }

    function toggleFuelTollFields() {
      const choice = document.querySelector('input[name="has-fuel-toll"]:checked')?.value;
      const box = document.getElementById('fuel-toll-extra');
      if (!box) return;
      if (choice === 'Ya') {
        box.classList.remove('hidden');
      } else {
        box.classList.add('hidden');
      }
    }

    function saveNewDoc(e, docType) {
      e.preventDefault();
      const isReimburse = docType === 'Reimburse';
      const date = document.getElementById('doc-date').value;
      const amount = Number(document.getElementById('doc-amount').value || 0);
      const title = document.getElementById('doc-title').value.trim();
      const payType = document.getElementById('doc-pay-type').value;
      const refNo = document.getElementById('doc-ref-no').value;
      const notes = document.getElementById('doc-notes').value.trim();

      const fuelChoice = !isReimburse ? (document.querySelector('input[name="has-fuel-toll"]:checked')?.value || 'Tidak') : 'Tidak';
      const vehicle = fuelChoice === 'Ya' ? (document.getElementById('doc-vehicle')?.value || '') : '';
      const kmAwal = fuelChoice === 'Ya' ? (document.getElementById('doc-km-awal')?.value.trim() || '') : '';

      const prefix = isReimburse ? 'RMB/SHK/2026/' : 'PD/SHK/2026/';
      const docNo = prefix + String(state.docs.length + 101).padStart(3, '0');

      const newDoc = {
        id: 'doc' + Date.now(),
        type: docType,
        docNo,
        date,
        title,
        payType,
        refNo,
        amount,
        hasFuelToll: fuelChoice,
        vehicle,
        kmAwal,
        requester: state.currentUser.name,
        requesterRole: state.currentUser.role,
        status: 'Pending',
        notes
      };

      state.docs.unshift(newDoc);
      saveDatabase();
      syncToGoogleSheet(isReimburse ? 'Reimburse' : 'Pengajuan_Dana', 'Input Baru', {
        No_Dokumen: docNo, Tanggal: date, Perihal: title, Jenis_Pembayaran: payType, Ref_SPM_SPK: refNo, Nominal: amount, Pemohon: state.currentUser.name, Status: 'Pending'
      });

    function exportDocsCsv(docType) {
      const rows = state.docs.filter(d => d.type === docType);
      const header = ['No Dokumen', 'Tanggal', 'Perihal', 'Jenis Pembayaran', 'Ref SPM/SPK', 'Nominal', 'Pemohon', 'Status'];
      const csv = [header.join(','), ...rows.map(r => [r.docNo, r.date, `"${r.title}"`, `"${r.payType}"`, r.refNo, r.amount, `"${r.requester}"`, r.status].join(','))].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${docType.replace(/\s+/g, '_')}_ShakaERP.csv`;
      a.click();
      showToast('File CSV berhasil diekspor!', 'success');

    function toggleSpdOperationalVehicle() {
      const mode = document.getElementById('spd-transport')?.value;

        box.classList.remove('hidden');

        box.classList.add('hidden');
      }
    }

    function applyDefaultSpdVehicle() {
      const cat = document.getElementById('spd-veh-cat')?.value;
      const typeEl = document.getElementById('spd-veh-type');
      const plateEl = document.getElementById('spd-veh-plate');
      if (!typeEl || !plateEl) return;
      if (cat === 'Motor') {
        typeEl.value = 'Honda Vario 160 ABS';
        plateEl.value = 'B 4910 SHK';
      } else {
        typeEl.value = 'Toyota Avanza Veloz';
        plateEl.value = 'B 2418 SHK';
      }
    }

      e.preventDefault();
      const mode = document.getElementById('spd-transport').value;
      const newSpd = {
        id: 'spd' + Date.now(),
        spdNo: `SPD/SHK/2026/${String(state.spdList.length + 14).padStart(3, '0')}`,
        stNo: '',
        project: document.getElementById('spd-project').value,
        spkRef: document.getElementById('spd-spk').value,
        destination: document.getElementById('spd-dest').value.trim(),
        departDate: document.getElementById('spd-depart').value,
        returnDate: document.getElementById('spd-return').value,
        transportMode: mode,
        vehicleCategory: mode === 'Kendaraan Operasional' ? document.getElementById('spd-veh-cat').value : '',
        vehicleType: mode === 'Kendaraan Operasional' ? document.getElementById('spd-veh-type').value.trim() : '',
        plateNumber: mode === 'Kendaraan Operasional' ? document.getElementById('spd-veh-plate').value.trim().toUpperCase() : '',
        purpose: document.getElementById('spd-purpose').value.trim(),
        requester: state.currentUser.name,
        requesterNip: state.currentUser.nip || 'SHK-EMP',
        requesterPosition: state.currentUser.position || state.currentUser.role,
        step1Pm: { status: 'Pending', by: '', at: '' },
        step2Hr: { status: 'Waiting', by: '', at: '' },
        step3Gm: { status: 'Waiting', by: '', at: '' },
        status: 'Menunggu Approval Project Manager'
      };
      state.spdList.unshift(newSpd);
      saveDatabase();
      syncToGoogleSheet('SPD_Surat_Tugas', 'Pengajuan SPD', {
        No_SPD: newSpd.spdNo, Proyek: newSpd.project, Tujuan: newSpd.destination, Berangkat: newSpd.departDate, Kembali: newSpd.returnDate, Transportasi: `${newSpd.transportMode} (${newSpd.vehicleType} ${newSpd.plateNumber})`, Pemohon: newSpd.requester, Status: newSpd.status
      });
      pushTelegramLog(`Pengajuan SPD Baru (${newSpd.spdNo}) oleh ${newSpd.requester} -> Menunggu Approval Project Manager`);
      closeModal();
      showToast('Pengajuan SPD dikirim ke Project Manager!', 'success');
      renderCurrentPage();
    }

    function processSpdApproval(spdId, stage, isApproved) {
      const spd = state.spdList.find(s => s.id === spdId);
      if (!spd) return;
      const now = new Date().toISOString().slice(0, 16).replace('T', ' ');
      const actor = `${state.currentUser.name} (${state.currentUser.role})`;

      if (!isApproved) {
        spd.status = 'Ditolak';
        if (stage === 1) spd.step1Pm = { status: 'Rejected', by: actor, at: now };
        if (stage === 2) spd.step2Hr = { status: 'Rejected', by: actor, at: now };
        if (stage === 3) spd.step3Gm = { status: 'Rejected', by: actor, at: now };
        saveDatabase();
        showToast('Pengajuan SPD ditolak.', 'warning');
        renderCurrentPage();
        return;
      }

      if (stage === 1) {
        spd.step1Pm = { status: 'Approved', by: actor, at: now };
        spd.step2Hr = { status: 'Pending', by: '', at: '' };
        spd.status = 'Menunggu Approval HR';
        showToast('Disetujui Project Manager! Diteruskan ke HR.', 'success');
      } else if (stage === 2) {
        spd.step2Hr = { status: 'Approved', by: actor, at: now };
        spd.step3Gm = { status: 'Pending', by: '', at: '' };
        spd.status = 'Menunggu Approval GM / Direksi';
        showToast('Disetujui HR! Diteruskan ke General Manager / Direksi.', 'success');
      } else if (stage === 3) {
        spd.step3Gm = { status: 'Approved', by: actor, at: now };
        spd.stNo = spd.spdNo.replace('SPD/', 'ST/');
        spd.status = 'Approved & Surat Tugas Terbit';
        showToast('Disetujui Final! Surat Tugas resmi diterbitkan.', 'success');
      }
      saveDatabase();
      renderCurrentPage();
    }

    function executeDeleteSpd(spdId) {
      if (!canDeleteModuleData(state.currentUser?.role)) return;
      const idx = state.spdList.findIndex(s => s.id === spdId);
      if (idx === -1) return;
      const removed = state.spdList[idx];
      state.spdList.splice(idx, 1);
      saveDatabase();
      syncToGoogleSheet('SPD_Surat_Tugas', 'Hapus SPD', { No_SPD: removed.spdNo, Tujuan: removed.destination, Pemohon: removed.requester });
      pushTelegramLog(`Hapus Pengajuan SPD (${removed.spdNo}) oleh ${state.currentUser.name} (${state.currentUser.role})`);
      showToast(`Data SPD ${removed.spdNo} berhasil dihapus!`, 'warning');
      renderCurrentPage();
    }

    function executeDeleteProgress(prgId) {
      if (!canDeleteModuleData(state.currentUser?.role)) return;
      const idx = state.progressLogs.findIndex(p => p.id === prgId);
      if (idx === -1) return;
      const removed = state.progressLogs[idx];
      // Kembalikan volume BOQ pada SPK terkait
      const spk = state.spkList.find(s => s.id === removed.spkId || s.spkNo === removed.spkNo);
      if (spk && spk.boqItems) {
        const boq = spk.boqItems.find(b => b.name === removed.itemName);
        if (boq) boq.doneQty = Math.max(0, boq.doneQty - Number(removed.qtyAdded || 0));
      }
      state.progressLogs.splice(idx, 1);
      saveDatabase();
      syncToGoogleSheet('Progress_Lapangan', 'Hapus Progress', { Tanggal: removed.date, No_SPK: removed.spkNo, Item: removed.itemName, Qty: removed.qtyAdded });
      pushTelegramLog(`Hapus Progress Lapangan (${removed.spkNo} - ${removed.itemName}) oleh ${state.currentUser.name} (${state.currentUser.role})`);
      showToast('Laporan progress dihapus & volume BOQ disesuaikan kembali!', 'warning');
      renderCurrentPage();
    }

    function refreshProgressBoqItems() {
      const spk = state.spkList.find(s => s.id === document.getElementById('prg-spk')?.value);
      const sel = document.getElementById('prg-boq');
      if (!spk || !sel) return;
      sel.innerHTML = (spk.boqItems || []).map((b, idx) => `<option value="${idx}">${b.name} (Sisa: ${b.totalQty - b.doneQty} ${b.unit})</option>`).join('');
    }

    function saveProgressReport(e) {
      e.preventDefault();
      const spk = state.spkList.find(s => s.id === document.getElementById('prg-spk').value);
      const boqIdx = Number(document.getElementById('prg-boq').value || 0);
      const qtyAdded = Number(document.getElementById('prg-qty').value || 0);
      if (!spk || !spk.boqItems[boqIdx] || qtyAdded <= 0) return;

      const boq = spk.boqItems[boqIdx];
      boq.doneQty = Math.min(boq.totalQty, boq.doneQty + qtyAdded);

      state.progressLogs.unshift({
        id: 'prg' + Date.now(),
        date: new Date().toISOString().slice(0, 10),
        spkId: spk.id,
        spkNo: spk.spkNo,
        siteName: spk.siteName,
        itemName: boq.name,
        qtyAdded,
        unit: boq.unit,
        reporter: state.currentUser.name,
        notes: document.getElementById('prg-notes').value.trim()
      });
      saveDatabase();
      syncToGoogleSheet('Progress_Lapangan', 'Input Progress', {
        Tanggal: new Date().toISOString().slice(0, 10), No_SPK: spk.spkNo, Site: spk.siteName, Item_Pekerjaan: boq.name, Qty_Terpasang: qtyAdded, Satuan: boq.unit, Pelapor: state.currentUser.name

      pushTelegramLog(`Progress Lapangan (${spk.siteName}): ${boq.name} +${qtyAdded} ${boq.unit} oleh ${state.currentUser.name}`);

      showToast('Progress lapangan disimpan & sisa qty SPK otomatis terpotong!', 'success');

    function approveSpmItem(spmId, isApproved) {
      const s = state.spmList.find(x => x.id === spmId);
      if (!s) return;
      if (!canApproveSpmByNominal(state.currentUser.role, s.contractValue)) {
        showToast('Role Anda tidak memiliki kewenangan approval untuk nominal SPM ini!', 'error');
        return;
      }
      const now = new Date().toISOString().slice(0, 16).replace('T', ' ');
      if (isApproved) {
        s.approvalStatus = 'Approved';
        s.approvedBy = `${state.currentUser.name} (${state.currentUser.role})`;
        s.approvedAt = now;
        pushTelegramLog(`Approval SPM (${s.clientDocNo} - ${formatRupiah(s.contractValue)}) disetujui oleh ${s.approvedBy}`);
        showToast(`SPM ${s.clientDocNo} berhasil di-approve!`, 'success');

        s.approvedBy = `${state.currentUser.name} (${state.currentUser.role})`;
        s.approvedAt = now;
        showToast(`SPM ${s.clientDocNo} ditolak.`, 'warning');

      saveDatabase();
      syncToGoogleSheet('SPM_Customer', isApproved ? 'Approve SPM' : 'Tolak SPM', {

    function saveNewSpm(e) {
      e.preventDefault();
      const val = Number(document.getElementById('spm-value').value || 0);
      const fileInput = document.getElementById('spm-file');
      const file = fileInput.files[0];

      const finalizeSave = (fileData, fileName) => {
        const initStatus = val > 500000000 ? 'Menunggu Approval (> 500 Juta)' : 'Menunggu Approval (<= 500 Juta)';
        const newSpm = {
          id: 'spm' + Date.now(),
          docType: document.getElementById('spm-doctype').value,
          clientDocNo: document.getElementById('spm-client-no').value.trim(),
          clientName: document.getElementById('spm-client-name').value.trim(),
          category: document.getElementById('spm-category').value,
          province: document.getElementById('spm-province').value,
          city: document.getElementById('spm-city').value,
          locationDetail: document.getElementById('spm-location-detail').value.trim(),
          contractValue: val,
          remainingValue: val,
          attachmentName: fileName || 'Dokumen_Customer.pdf',
          attachmentData: fileData || '',
          approvalStatus: initStatus,
          approvedBy: '',
          approvedAt: '',
          createdBy: state.currentUser.name,
          createdAt: new Date().toISOString().slice(0, 10)
        };
        state.spmList.unshift(newSpm);
        saveDatabase();
        syncToGoogleSheet('SPM_Customer', 'Input SPM Baru', {
          Jenis: newSpm.docType, No_Dokumen: newSpm.clientDocNo, Customer: newSpm.clientName, Kategori: newSpm.category, Provinsi: newSpm.province, Kota: newSpm.city, Detail_Lokasi: newSpm.locationDetail, Nilai_Kontrak: val, Status: initStatus, Input_Oleh: state.currentUser.name
        });
        pushTelegramLog(`Input SPM Baru (${newSpm.clientDocNo} - ${formatRupiah(val)}) oleh ${state.currentUser.name} -> ${initStatus}`);
        closeModal();
        showToast('Surat Pesanan Mitra (SPM) berhasil disimpan & direkap!', 'success');
        renderCurrentPage();
      };

      if (file) {
        const reader = new FileReader();
        reader.onload = ev => finalizeSave(ev.target.result, file.name);
        reader.readAsDataURL(file);
      } else {
        finalizeSave('', '');
      }
    }

    function executeDeleteSpk(spkId) {
      if (!canDeleteModuleData(state.currentUser?.role)) return;
      const idx = state.spkList.findIndex(s => s.id === spkId);
      if (idx === -1) return;
      const removed = state.spkList[idx];
      state.spkList.splice(idx, 1);
      saveDatabase();
      syncToGoogleSheet('SPK_Mandor', 'Hapus SPK', { No_SPK: removed.spkNo, Ref_SPM: removed.spmRef, Site: removed.siteName, Nilai_SPK: removed.totalValue });
      pushTelegramLog(`Hapus SPK (${removed.spkNo} - ${removed.siteName}) oleh ${state.currentUser.name} (${state.currentUser.role})`);
      showToast(`Surat Perintah Kerja (${removed.spkNo}) berhasil dihapus!`, 'warning');
      renderCurrentPage();
    }

    function approveSpkItem(spkId, isApproved) {
      const s = state.spkList.find(x => x.id === spkId);
      if (!s) return;
      if (!canApproveSpkByNominal(state.currentUser.role, s.totalValue)) {
        showToast('Role Anda tidak memiliki kewenangan approval untuk nominal SPK ini!', 'error');
        return;
      }
      const now = new Date().toISOString().slice(0, 16).replace('T', ' ');
      if (isApproved) {
        s.approvalStatus = 'Approved';
        s.status = 'Aktif';
        s.approvedBy = `${state.currentUser.name} (${state.currentUser.role})`;
        s.approvedAt = now;
        pushTelegramLog(`Approval SPK (${s.spkNo} - ${formatRupiah(s.totalValue)}) disetujui oleh ${s.approvedBy}`);
        showToast(`SPK ${s.spkNo} berhasil di-approve!`, 'success');
      } else {
        s.approvalStatus = 'Ditolak';
        s.status = 'Ditolak';
        s.approvedBy = `${state.currentUser.name} (${state.currentUser.role})`;
        s.approvedAt = now;
        showToast(`SPK ${s.spkNo} ditolak.`, 'warning');
      }
      saveDatabase();
      syncToGoogleSheet('SPK_Mandor', isApproved ? 'Approve SPK' : 'Tolak SPK', {
        No_SPK: s.spkNo, Ref_SPM: s.spmRef, Site: s.siteName, Rekanan: s.vendorName, Nilai_SPK: s.totalValue, Status: s.approvalStatus, Approver: s.approvedBy
      });
      renderCurrentPage();
    }

        {
          sheetName: 'Presensi_Capcay',
          label: 'Presensi Harian Capcay',
          headers: ['Nama_Karyawan', 'Username', 'Role', 'Jam_CheckIn', 'Status'],
          rows: state.attendanceLogs.map(a => [a.name, a.username, a.role, a.time, a.status])
        }
      ];
    }

    function renderGoogleSheetsPage() {
      const datasets = getSheetDatasets();
      const activeSheet = state.selectedSheetTab || datasets[0].sheetName;
      const currentDs = datasets.find(d => d.sheetName === activeSheet) || datasets[0];
      const canConfigure = isTopExecOrIt(state.currentUser.role);

      return `
        <div class="space-y-4">
          <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
            <div>
              <h1 class="text-xl font-extrabold text-slate-800">Rekap Data &amp; Sinkronisasi Google Spreadsheet (Per Sheet Menu)</h1>
              <p class="text-xs text-slate-500">Setiap menu memiliki tab sheet terpisah dengan format kolom rapi untuk Google Spreadsheet Anda.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <a href="${state.gsheetConfig.spreadsheetUrl}" target="_blank" rel="noopener noreferrer" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-sm flex items-center gap-1.5">
                <i class="fa-solid fa-up-right-from-square"></i> Buka Google Spreadsheet Tujuan
              </a>
              <button onclick="copySheetTsvForGoogleSheets('${currentDs.sheetName}')" class="px-3.5 py-2 rounded-xl shaka-blue hover:bg-[#093957] text-white font-bold text-xs flex items-center gap-1.5">
                <i class="fa-solid fa-copy"></i> Salin Sheet "${currentDs.sheetName}" (Siap Paste)
              </button>
              <button onclick="downloadSheetCsv('${currentDs.sheetName}')" class="px-3.5 py-2 rounded-xl bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-bold text-xs flex items-center gap-1.5">
                <i class="fa-solid fa-file-csv text-emerald-600"></i> Unduh CSV
              </button>
            </div>
          </div>

          <!-- Konfigurasi Webhook Google Apps Script (Khusus IT / Direksi) -->
          <div class="bg-white rounded-2xl border border-slate-200 card-shadow p-4 space-y-3 text-xs">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="font-extrabold text-[#0e4f78] flex items-center gap-2">
                <i class="fa-solid fa-cloud-arrow-up text-emerald-600"></i> Target Spreadsheet ID: <span class="font-mono bg-slate-100 px-2 py-0.5 rounded">${state.gsheetConfig.spreadsheetId}</span>
              </div>
              <span class="px-2.5 py-0.5 rounded-full ${state.gsheetConfig.webhookUrl ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-800'} font-bold text-[10px]">
                ${state.gsheetConfig.webhookUrl ? 'Live Webhook Terhubung' : 'Mode Rekap Lokal + Siap Paste / Apps Script'}
              </span>
            </div>
            ${canConfigure ? `
              <form onsubmit="saveGsheetWebhook(event)" class="flex flex-col sm:flex-row gap-2">
                <input id="gsheet-webhook-input" type="url" value="${state.gsheetConfig.webhookUrl || ''}" placeholder="Opsional: Tempel URL Web App Google Apps Script (https://script.google.com/macros/s/.../exec) untuk push otomatis" class="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-xs font-mono" />
                <button type="submit" class="px-4 py-2 rounded-xl shaka-blue text-white font-bold">Simpan Webhook</button>
                <button type="button" onclick="openAppsScriptGuideModal()" class="px-3.5 py-2 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold">Kode Apps Script</button>
              </form>
            ` : ''}
          </div>

          <!-- Tab Navigasi Sheet Per Menu -->
          <div class="flex flex-wrap gap-1.5">
            ${datasets.map(ds => `
              <button onclick="state.selectedSheetTab='${ds.sheetName}'; renderCurrentPage();" class="px-3 py-2 rounded-xl text-xs font-bold border transition ${ds.sheetName === currentDs.sheetName ? 'bg-emerald-600 text-white border-emerald-700 shadow-xs' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'}">
                <i class="fa-solid fa-table mr-1"></i> ${ds.sheetName} (${ds.rows.length})
              </button>
            `).join('')}
          </div>

          <!-- Pratinjau Tabel Sheet Aktif -->
          <div class="bg-white rounded-2xl border border-slate-200 card-shadow overflow-x-auto">
            <div class="px-4 py-3 bg-emerald-50 border-b border-emerald-200 flex items-center justify-between">
              <div class="font-extrabold text-xs text-emerald-900">Tab Sheet: <span class="font-mono">${currentDs.sheetName}</span> — ${currentDs.label}</div>
              <div class="text-[11px] text-emerald-700 font-semibold">${currentDs.rows.length} Baris Data Tersedia</div>
            </div>
            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="bg-slate-800 text-white">
                  ${currentDs.headers.map(h => `<th class="p-2.5 border-r border-slate-700 whitespace-nowrap font-mono text-[11px]">${h}</th>`).join('')}
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200">
                ${currentDs.rows.length === 0 ? `
                  <tr><td colspan="${currentDs.headers.length}" class="p-6 text-center text-slate-400">Belum ada baris data pada sheet ${currentDs.sheetName}.</td></tr>
                ` : currentDs.rows.map(r => `
                  <tr class="hover:bg-emerald-50/40">
                    ${r.map(cell => `<td class="p-2.5 border-r border-slate-100 whitespace-nowrap">${cell ?? '-'}</td>`).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>

          <!-- Log Aktivitas Input Terbaru yang Masuk ke Antrean Rekap -->
          <div class="bg-white rounded-2xl border border-slate-200 card-shadow p-4 space-y-2">
            <div class="font-bold text-xs text-slate-800">Riwayat Input Real-Time ke Rekap Spreadsheet (${(state.gsheetConfig.syncQueue || []).length} log)</div>
            <div class="max-h-44 overflow-y-auto divide-y divide-slate-100 text-[11px]">
              ${(state.gsheetConfig.syncQueue || []).length === 0 ? `<div class="py-3 text-slate-400">Setiap input/approval baru di menu mana pun akan otomatis tercatat di sini.</div>` : state.gsheetConfig.syncQueue.map(q => `
                <div class="py-1.5 flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <span class="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-mono font-bold mr-1.5">${q.sheetName}</span>
                    <span class="font-bold text-slate-700">${q.action}</span> oleh <span class="text-[#0e4f78] font-semibold">${q.actor}</span>
                  </div>
                  <span class="font-mono text-slate-400">${q.timestamp}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function saveGsheetWebhook(e) {
      e.preventDefault();
      state.gsheetConfig.webhookUrl = document.getElementById('gsheet-webhook-input').value.trim();
      saveDatabase();
      showToast('URL Webhook Google Apps Script berhasil disimpan!', 'success');
      renderCurrentPage();
    }

    function copySheetTsvForGoogleSheets(sheetName) {
      const ds = getSheetDatasets().find(d => d.sheetName === sheetName);
      if (!ds) return;
      const tsv = [ds.headers.join('\t'), ...ds.rows.map(r => r.map(v => String(v ?? '').replace(/\t|\n/g, ' ')).join('\t'))].join('\n');
      const ta = document.createElement('textarea');
      ta.value = tsv;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      showToast(`Data sheet "${sheetName}" disalin! Tinggal Ctrl+V di tab "${sheetName}" pada Google Spreadsheet.`, 'success');
    }

    function downloadSheetCsv(sheetName) {
      const ds = getSheetDatasets().find(d => d.sheetName === sheetName);
      if (!ds) return;
      const csv = [ds.headers.join(','), ...ds.rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(','))].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${sheetName}_ShakaERP.csv`;
      a.click();
      showToast(`File ${sheetName}_ShakaERP.csv berhasil diunduh!`, 'success');
    }

    function openAppsScriptGuideModal() {
      const scriptCode = `function doPost(e) {
  var payload = JSON.parse(e.postData.contents);
  var ss = SpreadsheetApp.openById("${GSHEET_ID}");
  var sheet = ss.getSheetByName(payload.sheetName);
  if (!sheet) {
    sheet = ss.insertSheet(payload.sheetName);
  }
  var keys = Object.keys(payload.row);
  if (sheet.getLastRow() === 0) {
    sheet.appendRow(["Waktu_Input", "Aksi", "Oleh_Akun"].concat(keys));
  }
  var values = keys.map(function(k) { return payload.row[k]; });
  sheet.appendRow([payload.timestamp, payload.action, payload.actor].concat(values));
  return ContentService.createTextOutput(JSON.stringify({status: "ok"})).setMimeType(ContentService.MimeType.JSON);
}`;
      openModal(`
        <div class="shaka-blue px-5 py-3.5 text-white flex items-center justify-between">
          <div class="font-bold text-sm">Kode Google Apps Script (Auto-Create Sheet Per Menu)</div>
          <button onclick="closeModal()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div class="p-5 space-y-3 text-xs">
          <p class="text-slate-600">Buka Google Spreadsheet Anda &rarr; <strong>Extensions &rarr; Apps Script</strong>, tempel kode berikut, lalu klik <strong>Deploy &rarr; New Deployment &rarr; Web App (Anyone)</strong> dan masukkan URL-nya ke kolom Webhook:</p>
          <pre class="p-3 rounded-xl bg-slate-900 text-emerald-300 font-mono text-[11px] overflow-x-auto select-all">${scriptCode}</pre>
          <div class="flex justify-end">
            <button onclick="closeModal()" class="px-4 py-2 rounded-xl shaka-blue text-white font-bold">Tutup</button>
          </div>
        </div>
      `);
    }

    // =========================================================================
    // 16. INITIALIZE ON LOAD
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      loadDatabase();
      setInterval(() => {
        const el = document.getElementById('header-clock');
        if (el) {
          el.textContent = new Date().toLocaleString('id-ID', {
            weekday: 'short', day: '2-digit', month: 'short', year: 'numeric',
            hour: '2-digit', minute: '2-digit', second: '2-digit'
          }) + ' WIB';
        }
      }, 1000);
    });
  </script>
</body>
</html>
